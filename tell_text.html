<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продвинутая озвучка текста</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #eef2f7;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { color: #333; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; text-align: left; font-weight: bold; }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 1rem;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #007bff; outline: none; }

        select, input[type="range"] {
            width: 100%;
            margin-bottom: 1rem;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1rem;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            color: white;
        }

        #start-btn { background-color: #28a745; }
        #stop-btn { background-color: #dc3545; }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Синтезатор речи</h2>
    
    <label for="text-to-speak">Текст:</label>
    <textarea id="text-to-speak" placeholder="Введите текст...">Привет! Выделите любое слово, и я начну читать именно с него. Если ничего не выделено, я начну с того места, где стоит курсор.</textarea>
    
    <p class="hint">💡 Поставьте курсор в нужное место текста и нажмите «Старт»</p>

    <label for="voice-select">Голос:</label>
    <select id="voice-select"></select>

    <div class="controls">
        <div>
            <label for="rate">Скорость: <span id="rate-val">1</span></label>
            <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
        </div>
        <div>
            <label for="pitch">Тембр: <span id="pitch-val">1</span></label>
            <input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
        </div>
    </div>

    <div class="button-group">
        <button id="start-btn">▶ Старт</button>
        <button id="stop-btn">■ Стоп</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-to-speak');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');

    let voices = [];

    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        voices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-name', voice.name);
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    rateInput.oninput = () => document.getElementById('rate-val').textContent = rateInput.value;
    pitchInput.oninput = () => document.getElementById('pitch-val').textContent = pitchInput.value;

    // Кнопка СТОП
    stopBtn.onclick = () => {
        synth.cancel();
    };

    // Кнопка СТАРТ
    startBtn.onclick = () => {
        if (synth.speaking) {
            synth.cancel();
        }

        const fullText = textInput.value;
        // Находим позицию курсора или начала выделения
        const startPos = textInput.selectionStart;
        
        // Обрезаем текст так, чтобы озвучка шла от курсора до конца
        const textToRead = fullText.substring(startPos);

        if (textToRead.trim() !== '') {
            const utterance = new SpeechSynthesisUtterance(textToRead);
            
            const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
            const voice = voices.find(v => v.name === selectedOption);
            if (voice) utterance.voice = voice;

            utterance.rate = rateInput.value;
            utterance.pitch = pitchInput.value;

            synth.speak(utterance);
        }
    };
</script>

</body>
</html>
