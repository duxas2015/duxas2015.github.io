<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Free HLS Player Example</title>  
    <!-- Include hls.js from a CDN -->
    <script src="https://cdn.tutorialjinni.com/hls.js/1.2.1/hls.min.js"></script>
    
</head>
<body>
    <!-- HTML5 Video Tag -->
    <video id="video" 
           width='480px' height='360px' controls autoplay
           src="https://ab.matham.ws/10_11_20/10/11/02/G75W6JXH/2UIEMMV7.mp4/master.m3u8?ha=32cc2c48ac623f7&hc=f72f44474127842&hi=bc4c96bd948c994&ht=ee66fc83f920546&hu=ad7c3471ad51850&hui=b2f1b2e9cd67d86&t=1746888132" type="application/x-mpegURL">
    </video>
    <!-- Invocation Script -->
    <script>
        if (Hls.isSupported()) {
          var video = document.getElementById('video');
          var hls = new Hls();
          hls.loadSource(video.src);
          hls.attachMedia(video);
        }else{
            alert("Cannot stream HLS, use another video source");
        }
    </script>
</body>
