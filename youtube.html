<!DOCTYPE html>
<html>
  <head>
    <title>YouTube Player</title>
	<style>
		.rewindBtnCls {
		   height:200px;
		   width:200px;
		}
	</style>
  </head>
  <body>
    <div id="player"></div>
	<div>
    <button id="rewindButton" class="rewindBtnCls">Rewind 2 Seconds</button>
    <button id="rewindButton3" class="rewindBtnCls">Rewind 3 Seconds</button>	
	</div>

    <script>
      // Load the IFrame Player API code asynchronously.
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // Create an <iframe> (and YouTube player) after the API code downloads.
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '390',
          width: '640',
          videoId: 'HDU9WoUgr30',
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      // The API will call this function when the video player is ready.
      function onPlayerReady(event) {
        // Video is ready
      }

      // The API calls this function when the player's state changes.
      function onPlayerStateChange(event) {
        // Handle state changes if needed
      }

      // Function to rewind video by 2 seconds
      function rewindVideo() {
        var currentTime = player.getCurrentTime();
        player.seekTo(currentTime - 2, true);
      }

      // Function to rewind video by 3 seconds
      function rewindVideo3() {
        var currentTime = player.getCurrentTime();
        player.seekTo(currentTime - 3, true);
      }

      // Add event listener to the rewind button
      document.getElementById('rewindButton').addEventListener('click', rewindVideo);
      document.getElementById('rewindButton3').addEventListener('click', rewindVideo3);	  
    </script>
  </body>
</html>
