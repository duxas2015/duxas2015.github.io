<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Professional Quiz Training</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        h1 { color: #1a73e8; text-align: center; }

        /* Стили фильтров */
        .filter-section { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            padding: 20px; 
            background: #f8f9fa; 
            border-radius: 8px; 
            border: 1px solid #e9ecef;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        label { font-weight: bold; font-size: 14px; color: #555; }
        select { 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #ced4da; 
            font-size: 15px; 
            background-color: white;
            outline: none;
        }
        select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        /* Карточка вопроса */
        .question-card { 
            margin-bottom: 40px; 
            padding: 25px; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            background: #fff;
            transition: transform 0.2s;
        }
        .question-text { 
            font-size: 18px;
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.5;
        }
        
        /* Варианты ответов */
        .answers-list { display: flex; flex-direction: column; gap: 10px; }
        .answer-item { 
            display: flex; 
            align-items: flex-start; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            border: 1px solid transparent;
            transition: background 0.2s;
        }
        .answer-item:hover { background: #f1f3f4; }
        .answer-item input { margin-top: 5px; margin-right: 15px; transform: scale(1.2); }
        .answer-content { font-size: 16px; }

        /* Кнопка проверки */
        .check-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .check-btn:hover { background-color: #1557b0; }

        /* Блок результата */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .result-box.correct { background-color: #e6f4ea; border-left: 5px solid #34a853; }
        .result-box.incorrect { background-color: #fce8e6; border-left: 5px solid #ea4335; }
        .result-header { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .correct-text { color: #137333; }
        .incorrect-text { color: #c5221f; }
        .description-text { font-size: 15px; line-height: 1.6; color: #3c4043; }

        /* Код */
        pre { background: #2d2d2d !important; padding: 15px !important; border-radius: 6px !important; margin: 15px 0 !important; }
        code { font-family: 'Consolas', 'Monaco', monospace !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Java Training Center</h1>

    <div class="filter-section">
        <div class="filter-group">
            <label>Выберите книгу:</label>
            <select id="bookSelect">
                <option value="">-- Выберите книгу --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Выберите главу:</label>
            <select id="chapterSelect" disabled>
                <option value="">-- Сначала выберите книгу --</option>
            </select>
        </div>
    </div>

    <div id="quiz-app"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

<script>
let globalData = [];

// 1. Загрузка данных
async function init() {
    try {
        const response = await fetch('data.json');
        globalData = await response.json();
        populateBooks();
    } catch (e) {
        console.error("Ошибка загрузки data.json:", e);
        document.getElementById('quiz-app').innerHTML = '<p style="color:red">Ошибка загрузки данных. Убедитесь, что файл data.json находится в той же папке и вы используете локальный сервер.</p>';
    }
}

// 2. Список книг
function populateBooks() {
    const bookSelect = document.getElementById('bookSelect');
    globalData.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.book;
        bookSelect.appendChild(opt);
    });
}

// 3. Выбор книги
document.getElementById('bookSelect').addEventListener('change', function() {
    const chapterSelect = document.getElementById('chapterSelect');
    const bookIndex = this.value;
    
    chapterSelect.innerHTML = '<option value="">-- Выберите главу --</option>';
    document.getElementById('quiz-app').innerHTML = '';

    if (bookIndex !== "") {
        chapterSelect.disabled = false;
        globalData[bookIndex].chapters.forEach((ch, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = ch.chapter_name;
            chapterSelect.appendChild(opt);
        });
    } else {
        chapterSelect.disabled = true;
    }
});

// 4. Выбор главы
document.getElementById('chapterSelect').addEventListener('change', function() {
    const bookIndex = document.getElementById('bookSelect').value;
    const chapterIndex = this.value;
    
    if (bookIndex !== "" && chapterIndex !== "") {
        const questions = globalData[bookIndex].chapters[chapterIndex].questions;
        renderQuestions(questions);
    }
});

// 5. Отрисовка вопросов
function renderQuestions(questions) {
    const container = document.getElementById('quiz-app');
    container.innerHTML = '';

    questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        // Форматирование кода в тексте вопроса
        const formattedText = q.text.replace(/<pre>/g, '<pre><code class="language-java">').replace(/<\/pre>/g, '</code></pre>');

        let html = `
            <div class="question-text">${q.idx}. ${formattedText}</div>
            <div class="answers-list" id="answers-container-${q.idx}">`;
        
        q.answers.forEach(ans => {
            const type = q.select_type === 'multiply' ? 'checkbox' : 'radio';
            const formattedAns = ans.text.replace(/<pre>/g, '<code class="language-java">').replace(/<\/pre>/g, '</code>');
            
            html += `
                <label class="answer-item">
                    <input type="${type}" name="q${q.idx}" value="${ans.letter}">
                    <div class="answer-content"><strong>${ans.letter}:</strong> ${formattedAns}</div>
                </label>`;
        });
        
        html += `
            </div>
            <button class="check-btn" onclick="checkAnswer(${q.idx}, ${JSON.stringify(q.correct.letter).replace(/"/g, '&quot;')}, '${q.correct.description.replace(/'/g, "\\'")}')">
                Check
            </button>
            <div id="result-${q.idx}" class="result-box"></div>
        `;
        
        card.innerHTML = html;
        container.appendChild(card);
    });
    
    // Применяем подсветку Prism к новому контенту
    Prism.highlightAll();
}

// 6. Логика проверки
function checkAnswer(idx, correctLetters, description) {
    const resultDiv = document.getElementById(`result-${idx}`);
    const selectedInputs = document.querySelectorAll(`input[name="q${idx}"]:checked`);
    const selectedValues = Array.from(selectedInputs).map(i => i.value);

    // Сравнение массивов (учитываем, что порядок может быть разным)
    const isCorrect = selectedValues.length === correctLetters.length && 
                      selectedValues.every(val => correctLetters.includes(val));

    resultDiv.style.display = 'block';
    
    if (isCorrect) {
        resultDiv.className = 'result-box correct';
        resultDiv.innerHTML = `
            <div class="result-header correct-text">✔ Correct</div>
            <div class="description-text">${description}</div>
        `;
    } else {
        resultDiv.className = 'result-box incorrect';
        resultDiv.innerHTML = `
            <div class="result-header incorrect-text">✖ Incorrect</div>
            <div class="description-text"><strong>Правильный ответ: ${correctLetters.join(', ')}</strong><br><br>${description}</div>
        `;
    }
    
    // Прокрутка к результату
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

init();
</script>
</body>
</html>
