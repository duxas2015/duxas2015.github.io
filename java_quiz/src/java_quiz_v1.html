<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Java Professional Quiz</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Стили фильтров */
        .filter-section { display: flex; gap: 20px; margin-bottom: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }

        .question-card { margin-bottom: 30px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .question-text { font-weight: 600; margin-bottom: 15px; }
        .answer-item { display: flex; align-items: center; padding: 8px; cursor: pointer; }
        .answer-item input { margin-right: 12px; }
        
        pre { background: #2d2d2d !important; padding: 15px !important; border-radius: 6px !important; white-space: pre !important; }
        code { font-family: 'Consolas', monospace !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Java Training Center</h1>

    <div class="filter-section">
        <div class="filter-group">
            <label>Выберите книгу:</label>
            <select id="bookSelect">
                <option value="">-- Выберите книгу --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Выберите главу:</label>
            <select id="chapterSelect" disabled>
                <option value="">-- Сначала выберите книгу --</option>
            </select>
        </div>
    </div>

    <div id="quiz-app"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

<script>
let globalData = [];

// 1. Загрузка JSON
async function init() {
    try {
        const response = await fetch('data.json');
        globalData = await response.json();
        populateBooks();
    } catch (e) {
        console.error("Ошибка загрузки:", e);
    }
}

// 2. Заполнение списка книг
function populateBooks() {
    const bookSelect = document.getElementById('bookSelect');
    globalData.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.book;
        bookSelect.appendChild(opt);
    });
}

// 3. Слушатель выбора книги
document.getElementById('bookSelect').addEventListener('change', function() {
    const chapterSelect = document.getElementById('chapterSelect');
    const bookIndex = this.value;
    
    chapterSelect.innerHTML = '<option value="">-- Выберите главу --</option>';
    document.getElementById('quiz-app').innerHTML = '';

    if (bookIndex !== "") {
        chapterSelect.disabled = false;
        globalData[bookIndex].chapters.forEach((ch, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = ch.chapter_name;
            chapterSelect.appendChild(opt);
        });
    } else {
        chapterSelect.disabled = true;
    }
});

// 4. Слушатель выбора главы и отображение вопросов
document.getElementById('chapterSelect').addEventListener('change', function() {
    const bookIndex = document.getElementById('bookSelect').value;
    const chapterIndex = this.value;
    const container = document.getElementById('quiz-app');
    
    container.innerHTML = '';

    if (bookIndex !== "" && chapterIndex !== "") {
        const questions = globalData[bookIndex].chapters[chapterIndex].questions;
        renderQuestions(questions);
    }
});

function renderQuestions(questions) {
    const container = document.getElementById('quiz-app');
    
    questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const formattedText = q.text.replace(/<pre>/g, '<pre><code class="language-java">').replace(/<\/pre>/g, '</code></pre>');

        let html = `<div class="question-text">${q.idx}. ${formattedText}</div><div class="answers-list">`;
        
        q.answers.forEach(ans => {
            const type = q.select_type === 'multiply' ? 'checkbox' : 'radio';
            const formattedAns = ans.text.replace(/<pre>/g, '<code class="language-java">').replace(/<\/pre>/g, '</code>');
            
            html += `
                <label class="answer-item">
                    <input type="${type}" name="q${q.idx}">
                    <span><strong>${ans.letter}:</strong> ${formattedAns}</span>
                </label>`;
        });
        
        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);
    });
    
    Prism.highlightAll();
}

init();
</script>
</body>
</html>
