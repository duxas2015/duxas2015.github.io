<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SRT to WebVTT Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>SRT to WebVTT Converter</h1>
    
    <div>
        <label for="idSourceFile">Select SRT Files:</label><br>
        <input type="file" id="idSourceFile" accept=".srt" multiple>
    </div>
	
    <button id="idHandleBtn">Handle</button>
    <div id="errorMessage" class="error"></div>

    <script>
        // Функция для преобразования SRT в WebVTT
        function turnSubtitleIntoVTT(text) {
            // Проверяем, что text — строка
            if (typeof text !== 'string' || !text.trim()) {
                throw new Error('Входной текст должен быть непустой строкой');
            }

            // Разбиваем текст на строки
            const lines = text.trim().split('\n');
            let vttOutput = 'WEBVTT\n\n';
            let i = 0;

            while (i < lines.length) {
                // Пропускаем пустые строки
                if (!lines[i].trim()) {
                    i++;
                    continue;
                }

                // Ожидаем номер субтитра
                const number = lines[i].trim();
                if (!/^\d+$/.test(number)) {
                    throw new Error(`Ожидался номер субтитра, получено: ${number}`);
                }
                i++;

                // Ожидаем временной код
                if (i >= lines.length) {
                    throw new Error('Неожиданный конец файла после номера субтитра');
                }
                const timecode = lines[i].trim();
                const timecodeMatch = timecode.match(/^(\d{2}:\d{2}:\d{1,2},\d{3}) --> (\d{2}:\d{2}:\d{1,2},\d{2,3})$/);
                if (!timecodeMatch) {
                    throw new Error(`Неверный формат временного кода: ${timecode}`);
                }
                // Преобразуем временной код (заменяем запятую на точку для WebVTT)
                const startTime = timecodeMatch[1].replace(',', '.');
                const endTime = timecodeMatch[2].replace(',', '.');
                i++;

                // Собираем текст субтитра
                let subtitleText = '';
                while (i < lines.length && lines[i].trim() !== '') {
                    subtitleText += lines[i].trim() + '\n';
                    i++;
                }
                subtitleText = subtitleText.trim();

                // Добавляем блок в WebVTT
                vttOutput += `${number}\n${startTime} --> ${endTime}\n${subtitleText}\n\n`;

                // Пропускаем пустые строки
                while (i < lines.length && !lines[i].trim()) {
                    i++;
                }
            }

            return vttOutput;
        }

        // Функция для вывода сообщения об ошибке
        function setErrorMessage(message) {
            const errorMessage = document.getElementById('errorMessage');
            if (errorMessage) {
                errorMessage.textContent = message;
            }
        }
		

		function shiftSubtitleTime(text, shift) {
			// Проверяем входные параметры
			if (typeof text !== 'string' || !text.trim()) {
				throw new Error('Входной текст должен быть непустой строкой');
			}
			if (typeof shift !== 'number' || isNaN(shift)) {
				throw new Error('Параметр shift должен быть числом');
			}

			// Разбиваем текст на строки
			const lines = text.split('\n');
			let output = [];
			let i = 0;

			// Проверяем заголовок WEBVTT
			if (lines[0].trim() !== 'WEBVTT') {
				throw new Error('Текст не начинается с WEBVTT');
			}
			output.push('WEBVTT');
			i++;

			// Функция для преобразования времени WebVTT в секунды
			function timeToSeconds(timeStr) {
				const match = timeStr.match(/^(?:(\d+):)?(\d{2}):(\d{2})\.(\d{3})$/);
				if (!match) {
					throw new Error(`Неверный формат времени: ${timeStr}`);
				}
				const hours = parseInt(match[1] || '0', 10);
				const minutes = parseInt(match[2], 10);
				const seconds = parseInt(match[3], 10);
				const milliseconds = parseInt(match[4], 10);
				return hours * 3600 + minutes * 60 + seconds + milliseconds / 1000;
			}

			// Функция для преобразования секунд обратно в формат WebVTT
			function secondsToTime(seconds) {
				if (seconds < 0) {
					throw new Error('Время не может быть отрицательным');
				}
				const hours = Math.floor(seconds / 3600);
				seconds %= 3600;
				const minutes = Math.floor(seconds / 60);
				seconds = seconds % 60;
				const milliseconds = Math.round((seconds % 1) * 1000);
				const wholeSeconds = Math.floor(seconds);
				return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${wholeSeconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
			}

			// Обрабатываем строки
			while (i < lines.length) {
				const line = lines[i].trim();

				// Пропускаем пустые строки
				if (!line) {
					output.push('');
					i++;
					continue;
				}

				// Проверяем, является ли строка временным кодом
				const timecodeMatch = line.match(/^(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})$/);
				if (timecodeMatch) {
					try {
						// Извлекаем начальное и конечное время
						const startTime = timeToSeconds(timecodeMatch[1]);
						const endTime = timeToSeconds(timecodeMatch[2]);

						// Смещаем время
						const newStartTime = startTime + shift;
						const newEndTime = endTime + shift;

						// Проверяем, что времена не отрицательные
						if (newStartTime < 0 || newEndTime < 0) {
							throw new Error(`Сдвиг приводит к отрицательному времени: ${line}`);
						}

						// Форматируем новое время
						const formattedStart = secondsToTime(newStartTime);
						const formattedEnd = secondsToTime(newEndTime);

						// Добавляем новую строку временного кода
						output.push(`${formattedStart} --> ${formattedEnd}`);
					} catch (error) {
						throw new Error(`Ошибка обработки временного кода "${line}": ${error.message}`);
					}
				} else {
					// Копируем строку без изменений (номер субтитра, текст или другие строки)
					output.push(lines[i]);
				}

				i++;
			}

			// Возвращаем результат, объединённый в строку
			return output.join('\n');
		}		

        // Функция для обработки файлов субтитров
        function handleSubtitle() {
            setErrorMessage('');
            const fileInput = document.getElementById('idSourceFile');
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                setErrorMessage('Пожалуйста, выберите хотя бы один файл');
                return;
            }

            Array.from(fileInput.files).forEach(file => {
                // Проверяем, что файл имеет расширение .srt
                if (!file.name.toLowerCase().endsWith('.srt')) {
                    setErrorMessage(`Файл ${file.name} не является SRT-файлом`);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const srtText = event.target.result;
                        const vttText = turnSubtitleIntoVTT(srtText);

                        // Создаём Blob для скачивания
                        const blob = new Blob([vttText], { type: 'text/vtt' });
                        const url = URL.createObjectURL(blob);
                        
                        // Создаём ссылку для скачивания
                        const downloadLink = document.createElement('a');
                        downloadLink.href = url;
                        downloadLink.download = file.name.replace(/\.srt$/i, '.vtt');
                        document.body.appendChild(downloadLink);
                        downloadLink.click();
                        document.body.removeChild(downloadLink);
                        URL.revokeObjectURL(url);
                    } catch (error) {
                        setErrorMessage(`Ошибка обработки файла ${file.name}: ${error.message}`);
                    }
                };
                reader.onerror = function() {
                    setErrorMessage(`Ошибка чтения файла ${file.name}`);
                };
                reader.readAsText(file);
            });
        }

        // Назначение обработчика для кнопки
        document.getElementById('idHandleBtn').addEventListener('click', handleSubtitle);
    </script>
</body>
</html>
