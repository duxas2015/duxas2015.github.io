<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Table Editor</title>
    <link rel="stylesheet" href="table_editor.css">
</head>
<body>
    <div class="container">
        <div class="button-container">
            <input type="file" id="fileInput" accept=".json">
            <button id="increaseFontButton">Increase Font</button>
            <button id="decreaseFontButton">Decrease Font</button>
            <button id="saveButton">Save</button>
            <button id="saveLocalButton">Save Local</button>
            <button id="repeatButton">Repeat</button>
            <button id="newButton">New</button>
            <button id="allButton">All</button>
            <button id="rerepeatButton">ReRepeat</button>
            <button id="reloadServerButton">Reload From Server</button>
            <button id="downloadLocalButton">Download Local</button>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>English</th>
                    <th>Russian</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody" data-json=""></tbody>
        </table>
    </div>
    <script src="table_editor.js"></script>
</body>
</html>
