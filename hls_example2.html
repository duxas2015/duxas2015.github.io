<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Free HLS Player Example</title>  
</head>
<body>
<video id="player" controls></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const hls = new Hls();
    hls.loadSource('https://hye1eaipby4w.matham.ws/08_03_23/08/03/13/YKV42BTV/QQTXXPHW.mp4/master.m3u8?ha=32cc2c48ac623f7&hc=f72f44474127842&hi=bc4c96bd948c994&ht=716f9b4565173c1&hu=ad7c3471ad51850&hui=de8696d27be7238&t=1747045045');
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
</script>
</body>	
</html>
