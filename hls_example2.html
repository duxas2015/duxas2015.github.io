<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Free HLS Player Example</title>  
</head>
<body>
<video id="player" controls></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('player');
    const hls = new Hls();
    hls.loadSource('https://ab.matham.ws/10_11_20/10/11/02/G75W6JXH/2UIEMMV7.mp4/master.m3u8?ha=32cc2c48ac623f7&hc=f72f44474127842&hi=bc4c96bd948c994&ht=ee66fc83f920546&hu=ad7c3471ad51850&hui=b2f1b2e9cd67d86&t=1746888132');
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
</script>
</body>	
</html>
